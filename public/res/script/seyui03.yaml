- bg: 003.jpg
- bgm: 言语暗示.mp3
- audio: seyui03_vocals.mp3

- role: 旁白
  text: 濑由衣追逐着某个只有她才明白的所谓“味道”猛地扎进了一旁的林子里。<Clear>
- text: 只见一个黑影立于树丛之间，濑由衣不由分说搭弓上弦。<Clear>

- text: 嗖的一声——一支箭飞快地向黑影射了过去。\n
- text: 而几乎在同时，从黑影的身上又射出了一支箭，向着濑由衣的眉心射来。濑由衣闪身躲过。

- roles: [ { name: 濑由衣, act: 正常_普通 } ]
  role: 濑由衣
  text: 在那里吗！
  audioStart: 00:00:03.928
  audioEnd: 00:00:05.593

- role: 旁白
  text: 然而此时，那个黑影已经消失了，就像从未出现过一样。

- role: 濑由衣
  text: ……！！
  audioStart: 00:00:10.045
  audioEnd: 00:00:10.927

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作1 } ]
  role: 幽桐
  text: …………？？
  audioStart: 00:00:12.397
  audioEnd: 00:00:14.934

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作1 } ]
  role: 濑由衣
  text: 等一下，为什么你这家伙会在这里啊！
  audioStart: 00:00:16.110
  audioEnd: 00:00:18.646

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作2 } ]
  role: 幽桐
  text: 嗯……我出现在这里也不是什么奇怪的事情吧。\n这里可是公园哦？
  audioStart: 00:00:20.080
  audioEnd: 00:00:25.189

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作2 } ]
  role: 濑由衣
  text: 唔……
  audioStart: 00:00:26.770
  audioEnd: 00:00:28.167

- role: 濑由衣
  text: 我正忙着，你突然冒出来，想打架吗？
  audioStart: 00:00:28.424
  audioEnd: 00:00:32.559

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作1 } ]
  role: 幽桐
  text: 抱歉抱歉。事实上，我也正在帮人追缉一个凶犯，刚才看到他就站在这里，下意识就射箭了。
  audioStart: 00:00:34.269
  audioEnd: 00:00:45.351

- role: 濑由衣
  text: 哼……原来是你把那家伙吓跑的！
  audioStart: 00:00:46.877
  audioEnd: 00:00:51.123

- role: 幽桐
  text: 抱歉了。我追着网络上的消息来到这里，便突然有一支箭向我射来，下意识就反击了，不过幸好你没有受伤，不愧是濑由衣呢。
  audioStart: 00:00:52.722
  audioEnd: 00:01:07.976

- roles: [ { name: 濑由衣, act: 叉腰_普通 }, { name: 幽桐, act: 动作1 } ]
  role: 濑由衣
  text: 唔……！！\n真是的，看到你这家伙的脸就没来由的生气。<Clear>
  audioStart: 00:01:09.704
  audioEnd: 00:01:14.538

- text: 上次让你跑掉了，这次干脆就在这里打一架吧！
  audioStart: 00:01:15.494
  audioEnd: 00:01:21.154

- role: 幽桐
  text: 啊，现在吗……这里打架，不太方便吧？还是下次约定一个地方，好好打一架吧。
  audioStart: 00:01:22.735
  audioEnd: 00:01:31.373

- roles: [ { name: 濑由衣, act: 思考_普通 }, { name: 幽桐, act: 动作1 } ]
  role: 濑由衣
  text: 唔，说得也有道理……那么就……
  audioStart: 00:01:33.009
  audioEnd: 00:01:36.391

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作1 } ]
  text: 不、不对！你又想找理由逃跑吗！
  audioStart: 00:01:37.181
  audioEnd: 00:01:40.122

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作3 } ]
- role: 幽桐
  text: 呵呵……濑由衣也变得敏锐了不少呢。
  audioStart: 00:01:41.353
  audioEnd: 00:01:45.672

- role: 濑由衣
  text: 喂——别想糊弄过去！
  audioStart: 00:01:47.106
  audioEnd: 00:01:49.017

- role: 幽桐
  text: 我确实是有正事要做，不能陪你。现在我们共同的目的，应该是找出那个试箭狂魔，而不是自己打起来对吧？
  audioStart: 00:01:50.396
  audioEnd: 00:02:00.780

- role: 濑由衣
  text: 唔唔唔……
  audioStart: 00:02:02.967
  audioEnd: 00:02:05.559

- role: 幽桐
  text: 还是说，你已经知道那是谁，不想让我找到他？
  audioStart: 00:02:07.158
  audioEnd: 00:02:14.032

- roles: [ { name: 濑由衣, act: 正常_害羞 }, { name: 幽桐, act: 动作3 } ]
  role: 濑由衣
  text: 诶！你怎么知道的！\n……啊唔……糟了。
  audioStart: 00:02:15.484
  audioEnd: 00:02:18.461

- role: 幽桐
  text: 果然是这样。可以告诉我具体的事情吗？我这里也有不少关于他的资料呢。
  audioStart: 00:02:19.931
  audioEnd: 00:02:29.195

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作3 } ]
  role: 濑由衣
  text: ……嗯……
  audioStart: 00:02:30.885
  audioEnd: 00:02:32.668

- text: 要说认出来其实也没有。<Clear>
  audioStart: 00:02:33.201
  audioEnd: 00:02:35.866

- text: 但是那家伙出现的周围，我能闻到芸仙草的味道。\n那是我来这里之前住的寺庙里经常点的香。<Clear>
  audioStart: 00:02:37.410
  audioEnd: 00:02:45.571

- text: 那个香只有寺庙里的人才会制作。\n
  audioStart: 00:02:47.170
  audioEnd: 00:02:49.559

- text: 做得最好的，就是我的师父。<Clear>
  audioStart: 00:02:50.018
  audioEnd: 00:02:54.815

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作3 } ]
- text: 但是，我的弓是从师父那儿继承下来的。\n
  audioStart: 00:02:56.047
  audioEnd: 00:02:59.759

- text: 而我经历的继承仪式，就是用这把弓把师父……<Clear>
  audioStart: 00:03:00.127
  audioEnd: 00:03:04.170

- text: 毫无疑问我的师父已经死了。\n他不可能出现在这里，还被当成试箭魔。
  audioStart: 00:03:05.641
  audioEnd: 00:03:13.213

- role: 幽桐
  text: 我倒是听说过东洋有一种术式，能够让死去的人暂时停留在世间，完成未尽的遗愿。
  audioStart: 00:03:14.702
  audioEnd: 00:03:22.807

- roles: [ { name: 濑由衣, act: 叉腰_害羞 }, { name: 幽桐, act: 动作3 } ]
- role: 濑由衣
  text: 我……
  audioStart: 00:03:24.406
  audioEnd: 00:03:24.884

- text: 我已经照着师父临终前的话，全都做了呀。<Clear>
  audioStart: 00:03:25.307
  audioEnd: 00:03:29.681

- text: 师父让我来交界都市，我来了，师父让我加入中央庭，我也加入了，我……我明明很听话了啊……<Clear>
  audioStart: 00:03:30.894
  audioEnd: 00:03:36.610

- text: 还能有什么未尽的遗愿呢！
  audioStart: 00:03:38.043
  audioEnd: 00:03:40.065

- role: 指挥使
  text: 在这里瞎想也没什么作用，还是让我们找到那个人再看是为什么吧。

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作3 } ]
- role: 濑由衣
  text: …………嗯。
  audioStart: 00:03:45.193
  audioEnd: 00:03:46.627

- role: 幽桐
  text: 我这边的情报倒是很简单。那个人喜欢烤肉。
  audioStart: 00:03:47.601
  audioEnd: 00:03:53.096

- role: 濑由衣
  text: 诶？
  audioStart: 00:03:54.438
  audioEnd: 00:03:55.320

- role: 幽桐
  text: 只要是美味的烤肉附近，通常都会有他出没的目击记录。\n虽然不知道是为什么，但是他好像很在意会烤肉的人呢。
  audioStart: 00:03:56.717
  audioEnd: 00:04:08.516

- roles: [ { name: 濑由衣, act: 害羞2 }, { name: 幽桐, act: 动作3 } ]
- role: 濑由衣
  text: 啊……师父那个笨蛋。<Clear>
  audioStart: 00:04:10.005
  audioEnd: 00:04:12.247

- text: 唔，不对，还不能确定是师父大人。<Clear>
  audioStart: 00:04:13.295
  audioEnd: 00:04:16.695

- text: 不过……师父确实很喜欢我做的烤肉……<Clear>
  audioStart: 00:04:17.577
  audioEnd: 00:04:22.374

- text: 嗯……下次……再准备一点烧酒好了……
  audioStart: 00:04:23.587
  audioEnd: 00:04:29.101

- role: 旁白
  text: 濑由衣认真地咕哝着。

- role: 濑由衣
  text: 那我要在这里做一下准备，差不多的时候我通知你再来公园这边吧。


- roles: []
- role: 旁白
  text: 濑由衣说着走掉了。\n一边咕哝着要准备什么样的酒……<Clear>

- text: 总觉得会有点危险，要与追求最强的试箭魔面对面，濑由衣手中的弓箭，也绝对不能弱了啊。