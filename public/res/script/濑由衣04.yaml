- bg: 003.jpg
- bgm: 言语暗示.mp3
- audio: 濑由衣04_vocals.mp3

- role: 旁白
  text: 在幽桐的情报帮助下，我们在濑由衣的树屋旁边又一次烤起了肉。就如同意料之中的那样……

- role: ？？？
  text: 吾寻遍世间各地，寻找至强之人。<Clear>
  audioStart: 00:00:05.258
  audioEnd: 00:00:10.932

- text: 汝二人中，有一人可成为至强之人。\n是为何者？
  audioStart: 00:00:11.765
  audioEnd: 00:00:19.730

- roles: [ { name: 濑由衣, act: 害羞2 } ]
  role: 濑由衣
  text: ………………居然真的只用烤肉就引出来了。
  audioStart: 00:00:21.084
  audioEnd: 00:00:25.145

- role: 指挥使
  text: 濑由衣你不要露出这么沮丧的表情啊……\n这说明你的烤肉技术真的很棒。

- roles: [ { name: 濑由衣, act: 害羞2 }, { name: 幽桐, act: 动作1 } ]
  role: 幽桐
  text: 嗯……这位前辈。也就是说我和濑由衣两个人之间一定要分出个胜负，胜者就会成为你承认的至强之人了？
  audioStart: 00:00:29.882
  audioEnd: 00:00:38.733

- role: ？？？
  text: 然也。吾将赠予箭术至高之珍宝于此人。
  audioStart: 00:00:39.774
  audioEnd: 00:00:45.396

- role: 濑由衣
  text: ……<Clear>
  audioStart: 00:00:46.646
  audioEnd: 00:00:48.989

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作1 } ]
  text: ……喏，光吃肉有点腻吧，要不要来点烧酒呢，师父？
  audioStart: 00:00:49.613
  audioEnd: 00:00:55.288

- role: ？？？
  text: 那就拜托你了……\n
  audioStart: 00:00:56.589
  audioEnd: 00:00:58.113

- text: 唔噢噢噢，什、什么，难道被发现了！！
  audioStart: 00:00:58.362
  audioEnd: 00:01:02.788

- role: 濑由衣
  text: ……真的是师父啊。
  audioStart: 00:01:04.559
  audioEnd: 00:01:06.966

- role: 指挥使
  text: 徒弟跟师父都是一个样呢……

- role: 师父
  text: 好家伙，你居然学会了诈我！
  audioStart: 00:01:11.255
  audioEnd: 00:01:14.685

- role: 濑由衣
  text: 您到底在想什么呀！为什么会跑到这边来？\n
  audioStart: 00:01:16.755
  audioEnd: 00:01:18.601

- text: 说到底，人死了以后还到处乱跑就已经很奇怪了。<Clear>
  audioStart: 00:01:18.830
  audioEnd: 00:01:24.450

- text: 果然是我的错吗？我没有完成您的遗愿？\n因为我杀死了您？
  audioStart: 00:01:25.887
  audioEnd: 00:01:34.334

- role: 师父
  text: 好了好了，傻孩子。我呀，是在旅途上发现了一个好东西，迫不及待想给我的宝贝徒弟看一眼呐。
  audioStart: 00:01:35.804
  audioEnd: 00:01:45.590

- role: 指挥使
  text: 难道说……这位老爷爷只是想找到濑由衣而已？

- role: 幽桐
  text: 我想是的呢。一直在烤肉附近游荡，大概是因为知道濑由衣最经常做的就是自己打猎并且烤肉吧。
  audioStart: 00:01:50.295
  audioEnd: 00:02:00.457

- role: 指挥使
  text: 那为什么要射伤别人呢。

- role: 师父
  text: 啊哈哈……这当然是我们门人的打招呼方式了啊！对吧。
  audioStart: 00:02:04.721
  audioEnd: 00:02:12.465

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作1 } ]
  role: 濑由衣
  text: 是哟，见面先来上一箭，\n就能判断出来是否有在认真修行。
  audioStart: 00:02:13.968
  audioEnd: 00:02:20.895

- role: 指挥使
  text: ……

- role: 师父
  text: 看吧，这是为师在旅途中偶然发现的魔箭。\n怎么样，很漂亮吧。
  audioStart: 00:02:25.012
  audioEnd: 00:02:31.367

- role: 濑由衣
  text: 好强的怨气。几千人……不，几万人的怨气……
  audioStart: 00:02:33.213
  audioEnd: 00:02:39.160

- role: 师父
  text: 这就是传说中射穿天地的那支魔箭了。\n非常适合你体内的鬼族血脉。<Clear>
  audioStart: 00:02:40.973
  audioEnd: 00:02:49.158

- text: 不过——幽桐。
  audioStart: 00:02:50.628
  audioEnd: 00:02:52.703

- roles: [ { name: 濑由衣, act: 正常_普通 }, { name: 幽桐, act: 动作3 } ]
  role: 幽桐
  text: 哎呀，注意到我了吗。
  audioStart: 00:02:54.353
  audioEnd: 00:02:56.493

- role: 师父
  text: 你也没有懈怠啊，我还真是不知道该把这支箭给你们中的谁。
  audioStart: 00:02:58.045
  audioEnd: 00:03:05.904

- role: 幽桐
  text: 这很好办，交给我们的指挥使决定就好了。
  audioStart: 00:03:07.570
  audioEnd: 00:03:12.553

- role: 指挥使
  text: 我选择给濑由衣。

- role: 濑由衣
  text: ……谢谢师父。
  audioStart: 00:03:46.420
  audioEnd: 00:03:49.066

- role: 濑由衣
  text: 但，我是不会使用它的。
  audioStart: 00:03:52.481
  audioEnd: 00:03:55.585

- role: 指挥使
  text: 啊？

- role: 濑由衣
  text: 虽然我很希望变得更强，成为最强。\n但那是因为我本身很强，不是因为我是“鬼”。<Clear>
  audioStart: 00:04:00.241
  audioEnd: 00:04:11.220

- roles: [ { name: 濑由衣, act: 害羞2 }, { name: 幽桐, act: 动作3 } ]
  text: 师父是大笨蛋。<Clear>
  audioStart: 00:04:12.641
  audioEnd: 00:04:14.373

- text: 我已经找到了自己的弓道，\n那是，由我自身，由“人”作为目标的道路。
  audioStart: 00:04:15.794
  audioEnd: 00:04:21.659

- role: 师父
  text: 那么，由衣啊。展现给我看吧。
  audioStart: 00:04:23.162
  audioEnd: 00:04:26.184

- roles: [ { name: 濑由衣, act: 动作01 }, { name: 幽桐, act: 动作3 } ]
  role: 濑由衣
  text: 师父……
  audioStart: 00:04:27.638
  audioEnd: 00:04:29.076

- role: 师父
  text: 你还记得，把师父的骨灰葬在哪里了吧？<Clear>
  audioStart: 00:04:30.857
  audioEnd: 00:04:35.938

- text: 最近呢，那里的云层变得越来越厚重了，\n师父我啊，好久没见到太阳了啊。
  audioStart: 00:04:37.245
  audioEnd: 00:04:47.782

- role: 濑由衣
  text: ……太阳？
  audioStart: 00:04:49.498
  audioEnd: 00:04:50.510

- role: 师父
  text: 是的，太阳。
  audioStart: 00:04:52.242
  audioEnd: 00:04:54.252
  
- text: 由衣，你做得到吗？
  audioStart: 00:04:54.448
  audioEnd: 00:04:56.098

- role: 濑由衣
  text: 如果我做到了，您就不会要求我改变自己的弓道了吧！
  audioStart: 00:04:57.437
  audioEnd: 00:05:02.910

- role: 师父
  text: 那是当然了。
  audioStart: 00:05:04.348
  audioEnd: 00:05:05.884

- role: 濑由衣
  text: 明白了，那就交给我吧！
  audioStart: 00:05:07.321
  audioEnd: 00:05:09.919

- role: 旁白
  text: 濑由衣翻手召唤出神弓，向着海边奔去。

- role: 指挥使
  text: 这下是真·箭在弦上了……等等我！

- bg: 001.jpg
- bgm: 言语暗示.mp3

- role: 旁白
  text: 乌云遮盖的天空下，海水泛着灰沉的浪。<Clear>

- roles: [ { name: 濑由衣, act: 正常_普通 } ]
  text: 濑由衣召唤出自己的神弓，与黑影一同立在海边。

- role: 师父
  text: 由衣，你终究还是要选择“人”之道吗。
  audioStart: 00:05:37.055
  audioEnd: 00:05:41.809

- role: 濑由衣
  text: 多说无益，师父。\n弓箭手终究还是要依靠手中的弓来证明的！<Clear>
  audioStart: 00:05:43.377
  audioEnd: 00:05:51.170

- text: 如果我赢了的话，还请您回到海对岸去吧！
  audioStart: 00:05:52.151
  audioEnd: 00:05:55.679

- role: 师父
  text: 真是桀骜的野猫。<Clear>
  audioStart: 00:05:57.297
  audioEnd: 00:05:59.747

- text: 既然你这么坚持，那师父我也不能再婆婆妈妈下去了！\n来吧，让我看看，你的箭法已经进步到何种程度了吧！
  audioStart: 00:06:00.711
  audioEnd: 00:06:12.131

- role: 濑由衣
  text: 放心吧师父大人，就用这一箭，给你看看我的成长！
  audioStart: 00:06:13.748
  audioEnd: 00:06:19.483

- bg: cg029.png
- bgm: 牢笼中的满月.mp3

- role: 旁白
  text: 搭弓、挽箭。<Clear>

- text: 手指轻动，刹那间红莲的火焰撕裂了黑暗。<Clear>

- text: 天空中的乌云被箭气撕开了一个巨大的口子——<Clear>

- role: 濑由衣
  text: 回到您该去的地方吧，师父大人！！！！
  audioStart: 00:06:30.102
  audioEnd: 00:06:33.239

- role: 旁白
  text: 汹涌的气浪甚至搅碎了站在她身旁的灵体。\n破碎的风中传来老人断断续续的话语……

- role: 师父
  text: 真好啊……濑由衣……
  audioStart: 00:06:38.303
  audioEnd: 00:06:40.884
  
- text: 你已经变得……\n
  audioStart: 00:06:41.358
  audioEnd: 00:06:42.698

- text: 和以前不一样了啊……<Clear>
  audioStart: 00:06:42.943
  audioEnd: 00:06:44.871

- text: 真是太好了啊……
  audioStart: 00:06:46.096
  audioEnd: 00:06:48.775

- role: 旁白
  text: 在濑由衣收起弓后，天空中被撕开的云层间落下了太阳的光。

- role: 濑由衣
  text: ……这一回，师父你应该放心了吧。
  audioStart: 00:06:53.856
  audioEnd: 00:06:57.009

- role: 旁白
  text: 没人回答她。

- bg: 001.jpg

- role: 旁白
  text: 濑由衣望着重新归于平静的灰蓝色海面。

- roles: [ { name: 濑由衣, act: 正常_普通 } ]
  role: 濑由衣
  text: 在全世界的黑门爆发的时候，师父感受到了什么，将所有的弟子召集了过来，说要找出自己名下最强的弟子。<Clear>
  audioStart: 00:07:05.390
  audioEnd: 00:07:15.388

- text: 一番比试后，一位师兄击败了所有人。<Clear>
  audioStart: 00:07:16.695
  audioEnd: 00:07:21.090

- text: 但师父摇了摇头说，你不是最强的。<Clear>
  audioStart: 00:07:22.250
  audioEnd: 00:07:26.694

- roles: [ { name: 濑由衣, act: 动作01 } ]
  text: 后来我进来了，我就拉弓对准了师父。<Clear>
  audioStart: 00:07:27.756
  audioEnd: 00:07:32.052

- text: 射出那支箭的时候，我就得到了这把以“毁灭”为名的武器的承认。<Clear>
  audioStart: 00:07:33.702
  audioEnd: 00:07:39.943

- roles: [ { name: 濑由衣, act: 叉腰_开心 } ]
  text: 那时候的师父很高兴。<Clear>
  audioStart: 00:07:40.989
  audioEnd: 00:07:45.057

- text: 后来，我依照师父的遗愿，带着师父的骨灰上了船前往这座城市。<Clear>
  audioStart: 00:07:46.070
  audioEnd: 00:07:54.173

- text: 当船行驶到太阳底下的时候，我就把盒子丢进了海里。<Clear>
  audioStart: 00:07:55.235
  audioEnd: 00:08:01.051

- text: 喏，就是那里。
  audioStart: 00:08:01.835
  audioEnd: 00:08:04.057

- role: 旁白
  text: 在散开的云层下，阳光落在水面上。\n那里仿佛有什么东西在闪闪发光。

- roles: [ { name: 濑由衣, act: 动作01 } ]
  role: 濑由衣
  text: 师父对于晒不到太阳这件事很在意呢。\n还特意带着海底的古董来到海面上拜托我。<Clear>
  audioStart: 00:08:12.013
  audioEnd: 00:08:20.933

- roles: [ { name: 濑由衣, act: 叉腰_普通 } ]
  text: 真是的，直说不就好了吗，搞得那么复杂。\n
  audioStart: 00:08:22.338
  audioEnd: 00:08:24.495

- text: 还说什么想看看我的成长。<Clear>
  audioStart: 00:08:25.132
  audioEnd: 00:08:27.762

- text: 明明就是在期待我能拥有自己的弓道，还非要拿宝物来当借口。<Clear>
  audioStart: 00:08:28.955
  audioEnd: 00:08:35.522

- roles: [ { name: 濑由衣, act: 正常_普通 } ]
  text: 我一定会成为最强的强者，不会让师父大人失望。
  audioStart: 00:08:36.388
  audioEnd: 00:08:39.819